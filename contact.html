<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Wolves Tech Initiative</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo-placeholder.svg">
  <link rel="icon" type="image/png" href="assets/logo-preview.png">
  <meta property="og:title" content="Contact | Wolves Tech Initiative">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wolvestechinitiative.org/contact.html">
  <meta property="og:image" content="https://wolvestechinitiative.org/assets/logo-preview.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://wolvestechinitiative.org/assets/logo-preview.png">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="assets/logo-placeholder.svg" alt="Wolves Tech Initiative Logo" class="brand-logo">
      Wolves Tech Initiative
    </a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <span class="divider">|</span>
      <a href="event-showcase.html">Events Showcase</a>
      <span class="divider">|</span>
      <a href="about.html">About</a>
      <span class="divider">|</span>
      <a href="contact.html">Contact</a>
      <span class="divider">|</span>
      <a href="donate.html">Donate</a>
    </nav>
  </header>

  <main>
    <section class="page-content page-heading">
      <h1>Contact</h1>
      <p>Have a question or want to get involved? Send us a message.</p>
    </section>

    <section class="contact-section">
      <form class="contact-form" action="mailto:info@wolvestechinitiative.org" method="post" enctype="text/plain">
        <div class="form-row">
          <div class="form-field">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="First Name" required>
          </div>
          <div class="form-field">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="Last Name" required>
          </div>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="Email" required>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="Message" required></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-contact">
        <h2>Contact</h2>
        <p>Email: info@wolvestechinitiative.org</p>
      </div>
    </div>
  </footer>

  <script src="assets/nav.js"></script>
</body>
</html>
